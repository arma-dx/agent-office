name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Biçim, lint, tip, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sürüm package.json packageManager alanından okunur. @v6 etiketi v6.0.10'u gösterir (pnpm 12 desteği yok).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Node ile içe aktarma denemesi (tsc ve Vitest'in yakalamadığı .js uzantısı hataları)
        run: pnpm run smoke
      - run: pnpm --filter @agent-office/web run build
      - name: Panel paketinde sunucu anahtarı yok (CLAUDE.md kural 1)
        run: |
          if grep -rEn 'sb_secret_|sk-ant-|service_role|SUPABASE_[A-Z_]*KEY|ANTHROPIC_API_KEY|DATABASE_URL|postgres(ql)?://' apps/web/dist; then
            echo "Panelin derlenmiş dosyalarında sunucuya ait anahtar ya da değişken adı bulundu." >&2
            exit 1
          fi

  secrets:
    name: Gizli anahtar taraması (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks kur (sağlama toplamı doğrulanır)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - run: ./gitleaks git --redact --no-banner --verbose .
