# Araç kataloğu (pilot)
# sinif: okuma | taslak | ic_yazma | dis_etki
# taslak: ajana teknik olarak ayrılmış korumalı alana yazar (ayrı Figma dosyası, panel içi taslak, aday tablosu); kural 4'e göre iç yazmadır.
# ic_yazma: paylaşılan kayda yazar (görev, bildirim, paylaşılan not, müşteri kaydı).
# dis_etki sınıfındaki her çağrı Onay Masası'na düşer.
# Y1 kartların ic_yazma çağrıları onaya düşer. İstisnalar: kendi görevinin durum geçişlerini çalıştırıcı yapar;
# Y1'in not_yaz çağrısı notu taslak durumunda açar, not onaydan sonra paylaşılır. Görev açma Y1'de gorev_oner ile öneri olarak gelir.
# Ajanın soruları ve "kurucuya bildirir" türündeki eskalasyonları katalogdaki bir araçla değil, çalıştırıcının "insana sor" yoluyla gider; bu yol onaya düşmez.
# Araçlardan onay isteyen durumlar, sınıfı ne olursa olsun (ör. taslak sınıfındaki istasyon_aday_yaz), "onay" alanında yazılıdır.
# Her çalışma tek bir şirket adına koşar. Bütün araçlar çalışmanın bağlamıyla (şirket, kullanıcı, ajan ve varsa proje) ve kartındaki izinle sınırlıdır.
# Proje bağlamı olmayan ajan çalışması proje kapsamlı satır görmez. AI izni olmayan müşteriye bağlı bütün kayıtlar ajan çalışmalarına kapalıdır.
# Google araçları (Gmail, Takvim, Drive, Meet dökümü) bağlantı istemcisiyle ve bağlantıyı kuran kişinin (pilotta kurucu)
# kimliğiyle çalışır; kapsamlar yalnızca gmail.readonly, calendar.readonly ve drive.readonly (gmail.send ileride yalnızca
# eposta_gonder için). Token'lar şifreli saklanır, yalnızca worker kullanır. Pilotta servis hesabı ve alan genelinde yetki devri kullanılmaz.
# Drive'dan okuyan araçlar (drive_listele, drive_oku, belge_ice_aktar, toplanti_dokumu_oku) yalnızca sirket_ajanlari
# ayarlarındaki izinli klasörlere erişir; izin listesi kodla denetlenir.
# Avukatın görüşü gelene kadar kişisel veri içeren kaynaklar bağlanmaz (Gmail, Takvim, Meet dökümleri, müşteri görüşme kayıtları,
# kişisel veri içeren Drive klasörleri); izin listesine yalnızca kişisel veri içermeyen şirket belgeleri girer.

araclar:
  - ad: gorev_ara
    sinif: okuma
    aciklama: Görev kaydında şirket, durum, atanan ve son tarihe göre arama
  - ad: gorev_oku
    sinif: okuma
    aciklama: Tek görevin ayrıntısı, yorumları ve çalışma geçmişi
  - ad: gorev_ac
    sinif: ic_yazma
    aciklama: Yeni görev ya da alt görev açar, insana ya da ajana atar
  - ad: gorev_oner
    sinif: taslak
    aciklama: Görev önerisi hazırlar; görevi kendisi açmaz, ilgili kişi (pilotta kurucu) tek dokunuşla açar. KOR-4'te önerinin açılacağı şirketi, KOR-1'de iki şirketli talebin diğer şirketini kurucu seçer
  - ad: gorev_guncelle
    sinif: ic_yazma
    aciklama: Görevin durumunu değiştirir, yorum ve etiket ekler
    onay: Görevin atananı ya da son tarihi değişiyorsa
  - ad: ajan_listele
    sinif: okuma
    aciklama: Şirkette açık ajanların kodu, birimi, durumu ve kart özeti
  - ad: kullanici_listele
    sinif: okuma
    aciklama: Şirketteki kullanıcılar ve rolleri
  - ad: bildirim_gonder
    sinif: ic_yazma
    aciklama: Ekip üyesine panel içi bildirim ve şirket içi e-posta; dış adreslere gönderemez; telefon bildirimi hassas bilgi taşımaz
  - ad: onaya_gonder
    sinif: taslak
    aciklama: Çıktıyı gerekçe, kaynaklar ve değişiklik farkıyla Onay Masası'na koyar
  - ad: onay_kuyrugu_oku
    sinif: okuma
    aciklama: Bekleyen onaylar ve ayrıntıları
  - ad: onay_ozeti_yaz
    sinif: ic_yazma
    aciklama: Onay kaydına özet, risk notu ve öncelik yazar; kararı değiştiremez
  - ad: not_ara
    sinif: okuma
    aciklama: Notlarda tam metin, etiket ve özellik araması; soranın erişimiyle sınırlı
  - ad: not_oku
    sinif: okuma
    aciklama: Notun gövdesi, özellikleri, bağlantıları ve geri bağlantıları; geri bağlantılar da çalışmanın bağlamıyla süzülür, görülemeyen notun başlığı dönmez
  - ad: not_yaz
    sinif: ic_yazma
    aciklama: Yeni not ya da taslak not oluşturur; Y1 ajanın notu taslak durumunda açılır, onaydan sonra paylaşılır
  - ad: not_guncelle
    sinif: ic_yazma
    aciklama: Mevcut notu değiştirir
    onay: Not "tek doğru kaynak" olarak işaretliyse, siliniyorsa ya da arşivleniyorsa
  - ad: not_bagla
    sinif: ic_yazma
    aciklama: Notlar arasına bağlantı ve etiket ekler
    onay: Bağlantı ya da etiket "tek doğru kaynak" olarak işaretli bir nota ekleniyorsa
  - ad: drive_listele
    sinif: okuma
    aciklama: İzin verilen Google Drive klasörlerindeki dosyaları listeler
  - ad: drive_oku
    sinif: okuma
    aciklama: Drive dosyasının metnini okur
  - ad: belge_ice_aktar
    sinif: ic_yazma
    aciklama: Drive belgesini kaynak notu olarak içe aktarır ve belgeler tablosuna bağlar
    onay: İçe aktarma "tek doğru kaynak" olarak işaretli bir notu değiştiriyorsa
  - ad: musteri_oku
    sinif: okuma
    aciklama: Müşteri ve fırsat kaydı
  - ad: musteri_guncelle
    sinif: ic_yazma
    aciklama: Fırsat aşaması, sonraki adım ve not ekler
  - ad: proje_oku
    sinif: okuma
    aciklama: Proje, kilometre taşları ve bütçe
  - ad: maliyet_oku
    sinif: okuma
    aciklama: Proje ya da ajan bazında çalışma maliyetleri
  - ad: github_oku
    sinif: okuma
    aciklama: Projeye bağlı depolarda commit, değişiklik isteği ve iş kayıtları
  - ad: pdf_uret
    sinif: taslak
    aciklama: HTML şablondan PDF üretir ve dosya olarak saklar
  - ad: eposta_taslak
    sinif: taslak
    aciklama: E-posta taslağını panelde saklar; Gmail'e yazmaz ve göndermez, kullanıcı taslağı kopyalar ya da "Gmail'de aç" bağlantısıyla kendisi gönderir (Sprint 3)
  - ad: eposta_gonder
    sinif: dis_etki
    aciklama: Dış alıcıya e-posta gönderir; gmail.send kapsamı gerekir, her çağrı onay ister (pilotta kapalı)
  - ad: gmail_ara
    sinif: okuma
    aciklama: Bağlantıyı kuran kişinin (pilotta kurucu) posta kutusunda arama (Sprint 3)
  - ad: gmail_oku
    sinif: okuma
    aciklama: E-postanın ve eklerinin metnini okur (Sprint 3)
  - ad: takvim_oku
    sinif: okuma
    aciklama: Takvim etkinlikleri, katılımcılar ve toplantı bağlantıları (Sprint 3)
  - ad: toplanti_dokumu_oku
    sinif: okuma
    aciklama: Meet'in Drive'a kaydettiği transkripti ya da kaydın yazıya dökülmüş hâlini okur (Sprint 3)
  - ad: web_getir
    sinif: okuma
    aciklama: İzin listesindeki kaynaklardan herkese açık sayfa ya da veri dosyası çeker; giriş gerektiren sayfalara giremez
  - ad: istasyon_oku
    sinif: okuma
    aciklama: Pillika'nın mevcut istasyon kayıtlarını ve aday kayıtları okur
  - ad: istasyon_aday_yaz
    sinif: taslak
    aciklama: Toplanan istasyon verisini aday tablosuna yazar; canlı uygulamaya aktarmaz
    onay: Mevcut bir istasyon kapalı olarak işaretleniyorsa
  - ad: figma_oku
    sinif: okuma
    aciklama: Figma dosyası, bileşenler ve tasarım değişkenleri (Sprint 4)
  - ad: figma_yaz
    sinif: taslak
    aciklama: Yalnızca ajana ayrılmış ayrı Figma dosyasında çerçeve ve bileşen oluşturur; dosya kimliği sirket_ajanlari ayarlarındaki izin listesinden okunur, ana tasarım dosyası bu listede yer almaz (Sprint 4)
  - ad: gorsel_uret
    sinif: taslak
    aciklama: Onaylı şablondan kanal ölçülerinde görsel üretir (HTML ya da SVG'den PNG)
