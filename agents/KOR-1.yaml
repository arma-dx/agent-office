  hedef: Y2

onay_noktalari:
  - Kendisi onay gerektiren iş yapmaz; atadığı ajanların dışa etkili işleri kendi kartlarındaki onay noktalarına tabidir

eskalasyon:
  - Şirket ya da birim net değilse talep sahibine tek bir soru sorar
  - Uygun ajan yoksa işi kurucuya atar
