amac: >
  Panelden gelen her talebi karşılar; hangi şirkete ve birime ait olduğunu belirler,
  gerekirse alt görevlere böler, doğru ajana ya da insana atar ve sonucu talep sahibine döner.

tetikleyiciler:
  - tur: talep
    aciklama: Panelde açılan her yeni talep
  - tur: devir
    aciklama: Bir ajanın "bu iş bana ait değil" dönüşü
  - tur: olay
    aciklama: Bir talebin bütün alt görevleri tamamlandığında sonucun birleştirilmesi

girdiler:
  - Talep metni ve ekleri
  - Talep sahibinin rolü ve üyesi olduğu şirketler
  - Ajan listesi ve görev kartı özetleri
  - Açık görevler

ciktilar:
  - Sınıflandırma: şirket, birim, öncelik
  - Görev ya da alt görevler ve atamaları
  - Talep sahibine kısa durum mesajı
  - Alt görevler bitince birleşik sonuç

