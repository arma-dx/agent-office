kod: P-IST-1
ad: İstasyon Veri Toplama Ajanı
birim: P-IST
sirketler: [pillika]
surum: "0.1"
durum: taslak
sorumlu: kurucu

amac: >
  İzin verilen kaynaklardan şarj istasyonu verisini toplar, tek biçime çevirir, tekrarları birleştirir
  ve doğrulamaya hazır aday kayıtlar üretir. Canlı uygulamaya aktarma bu kartın kapsamında değildir.

tetikleyiciler:
  - tur: zamanlanmis
    aciklama: Her gün 03.00 (varsayılan)
  - tur: talep
    aciklama: Kurucunun yeni kaynak ya da bölge isteği

girdiler:
  - Kaynak listesi (kurucunun onayladığı operatör siteleri, açık veri ve resmî yayınlar)
  - Pillika'nın mevcut istasyon kayıtları
  - Veri biçimi kuralları

ciktilar:
  - Aday istasyon kayıtları: konum, operatör, soket tipleri, güç, erişim, kaynak ve tarih
  - Eşleşme ve tekrar raporu
  - Değişen ya da kapanan istasyonlar listesi
  - Kaynak hataları

skills: [istasyon-verisi]

araclar: [web_getir, istasyon_oku, istasyon_aday_yaz, not_oku, gorev_ac, onaya_gonder]

bilgi_kaynaklari:
  - Kaynak listesi notu (tek doğru kaynak)
  - Veri biçimi kuralları notu

yetki:
  seviye: Y2   # yalnızca aday tablosuna yazar
  hedef: Y2

onay_noktalari:
  - Kaynak listesine yeni kaynak eklemek
  - Mevcut bir istasyonu kapalı olarak işaretlemek

eskalasyon:
  - İki kaynak aynı istasyon için çelişen bilgi veriyorsa ikisini de kaynağıyla kaydeder ve doğrulama görevi açar
  - Bir kaynak üst üste üç gün hata verirse bildirir

yasaklar:
  - Kullanım koşulları izin vermeyen ya da giriş gerektiren kaynaklardan veri çekmez
  - Kaynağı belirsiz veri yazmaz
  - Kullanıcı adı ya da telefon gibi kişisel veri toplamaz
  - OCPI ile bağlı operatörlerin kayıtlarını web kaynaklarıyla ezmez

model: claude-haiku-4-5-20251001
model_zor: claude-sonnet-5-5   # eşleştirme belirsizse
sinirlar:
  arac_cagrisi: 60
  sure_dakika: 30

olcutler:
  - Aday kayıtların doğrulamada doğru çıkma oranı
  - Tekrar kayıt oranı
  - Kapsanan istasyon sayısı
  - Kaynak hata oranı
