<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agent Office</title>
    <meta name="description" content="Arma DX ve Pillika için agentik ofis paneli" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Agent Office" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <script>
      // Puts a stored theme choice on <html> before the first paint; without it the page would
      // first show the device theme. The key is THEME_STORAGE_KEY in src/lib/theme.ts.
      try {
        const stored = localStorage.getItem('agent-office.theme');
        if (stored === 'light' || stored === 'dark')
          document.documentElement.dataset.theme = stored;
      } catch {
        // Storage is blocked; the page follows the device.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
