# Yalnızca gerçek paketler çalışma alanıdır; supabase/, skills/, agents/, docs/ düz klasördür.
packages:
  - apps/*
  - packages/*

# Her bağımlılığın monorepoda tek sürümü olur. `pnpm add` sürümü buraya, `catalog:` ifadesini package.json'a yazar.
catalogMode: strict
catalog:
  '@eslint/js': 10.0.1
  '@fontsource-variable/ibm-plex-sans': 5.3.0
  '@hookform/resolvers': 5.9.1
  '@tailwindcss/vite': 4.3.3
  '@tanstack/eslint-plugin-query': 5.104.0
  '@tanstack/eslint-plugin-router': 1.162.0
  '@tanstack/react-query': 5.104.0
  '@tanstack/react-router': 1.170.41
  '@tanstack/router-plugin': 1.168.42
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.7
  '@types/node': 24.19.0
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  fastify: 5.12.5
  globals: 17.12.0
  jsdom: 30.0.1
  lucide-react: 1.49.0
  pg: 8.23.1
  pg-boss: 12.35.1
  prettier: 3.9.9
  radix-ui: 1.6.7
  react: 19.3.0
  react-dom: 19.3.0
  react-hook-form: 7.89.0
  sonner: 2.0.8
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vite: 8.3.1
  vitest: 5.0.2
  zod: 4.6.5

savePrefix: ''
engineStrict: true
strictPeerDependencies: true

# Tedarik zinciri korumaları. Açıkça yazılan minimumReleaseAge katı çalışır: 24 saatten genç sürüm kurulmaz.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1 # @babel/core <- eslint-plugin-react-hooks; eski, provenance'sız sürüm; incelendi
blockExoticSubdeps: true
# Derleme betikleri yalnızca allowBuilds ile onaylanır (onlyBuiltDependencies pnpm 12'de yok sayılır).
strictDepBuilds: true
