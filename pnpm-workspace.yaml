# Yalnızca gerçek paketler çalışma alanıdır; supabase/, skills/, agents/, docs/ düz klasördür.
packages:
  - apps/*
  - packages/*

# Her bağımlılığın monorepoda tek sürümü olur. `pnpm add` sürümü buraya, `catalog:` ifadesini package.json'a yazar.
catalogMode: strict
catalog:
  '@eslint/js': 10.0.1
  '@testing-library/dom': 10.4.2
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@types/node': 24.19.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.7
  fastify: 5.12.5
  globals: 17.12.0
  jsdom: 30.0.1
  prettier: 3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 6.0.3
  typescript-eslint: 8.71.0
  vite: 8.3.1
  vitest: 5.0.2
  zod: 4.6.5

savePrefix: ''
engineStrict: true
strictPeerDependencies: true

# Tedarik zinciri korumaları. Açıkça yazılan minimumReleaseAge katı çalışır: 24 saatten genç sürüm kurulmaz.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1 # @babel/core <- eslint-plugin-react-hooks; eski, provenance'sız sürüm; incelendi
blockExoticSubdeps: true
# Derleme betikleri yalnızca allowBuilds ile onaylanır (onlyBuiltDependencies pnpm 12'de yok sayılır).
strictDepBuilds: true
